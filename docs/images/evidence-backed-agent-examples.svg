    <text x="1209" y="731" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0a1b44">explicitly says why</text>
  </g>
  <line x1="70" y1="832" x2="1623" y2="832" stroke="#ced8e7" stroke-width="2"/>
