<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Engraphis measured token and context savings</title>
  <desc id="desc">A dark-mode chart with three deterministic offline comparisons. Structure-aware chunks reduce mean retrieved content from 740.3 to 214.3 tokens and the smallest evidence-holding memory from 162.2 to 42.4 tokens while Recall at 5 remains 1.000. A compact JSON-shape recall payload proxy uses 10,202 rather than 23,810 tokens, 57.15 percent less; this is not an MCP transport or provider-billing measurement. Exact commands, suite digest 4d7e40607319cd4bf8caee3897f1e416dbe5b81998b37a7e4839409ee2923537, and config digests are recorded in BENCHMARKS.md. Public-safe artifact SHA-256: c3a74f1770ad3f868f55261ba11680e2dadca30167082ac2cb6669f9e3bdfad2. External, model-dependent, latency, consolidation, and productivity numbers remain unpublished until equivalent evidence exists.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <linearGradient id="engraphis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="980" rx="30" fill="url(#page)"/>
  <rect x="24" y="22" width="1152" height="936" rx="24" fill="#0b1220" stroke="#263247"/>

  <text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="700" fill="#f8fafc">Give your agent more room to think</text>
  <text x="70" y="104" font-family="Inter, Arial, sans-serif" font-size="17.6" fill="#a8b4c7">Three deterministic offline comparisons with checksum-bound public evidence.</text>

  <rect x="70" y="130" width="18" height="8" rx="4" fill="#64748b"/>
  <text x="98" y="140" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#a8b4c7">Baseline</text>
  <rect x="245" y="130" width="18" height="8" rx="4" fill="url(#engraphis)"/>
  <text x="273" y="140" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#a8b4c7">Engraphis</text>
  <text x="1128" y="140" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13.2" fill="#7f8da3">Each row has its own baseline</text>

  <g filter="url(#shadow)">
    <rect x="70" y="164" width="1058" height="112" rx="16" fill="#111a2b" stroke="#27344a"/>
    <text x="94" y="198" font-family="Inter, Arial, sans-serif" font-size="18.7" font-weight="700" fill="#f8fafc">Public evidence is checksum-bound</text>
    <text x="94" y="226" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">Artifact, fixture-suite digest, exact commands, and per-command config digests</text>
    <text x="94" y="252" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#fbbf24">No external or model-dependent number is published without the same evidence</text>
    <text x="1098" y="214" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#5eead4">offline-fixtures-v1.json</text>
    <text x="1098" y="244" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">3 registered runs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="290" width="1058" height="112" rx="16" fill="#111a2b" stroke="#27344a"/>
    <text x="94" y="320" font-family="Inter, Arial, sans-serif" font-size="18.7" font-weight="700" fill="#f8fafc">Retrieved memory content per question</text>
    <text x="94" y="345" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">Long-document test · 18 questions · Recall@5 1.000</text>
    <text x="462" y="316" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#cbd5e1">Whole documents · 740.3 tokens</text>
    <rect x="462" y="327" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="462" y="365" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#67e8f9">Focused chunks · 214.3 tokens</text>
    <rect x="462" y="376" width="127" height="12" rx="6" fill="url(#engraphis)"/>
    <text x="1098" y="352" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="29.7" font-weight="700" fill="#5eead4">71.1% less</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="416" width="1058" height="112" rx="16" fill="#111a2b" stroke="#27344a"/>
    <text x="94" y="446" font-family="Inter, Arial, sans-serif" font-size="18.7" font-weight="700" fill="#f8fafc">Smallest useful memory returned</text>
    <text x="94" y="471" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">The same 18 questions found supporting evidence</text>
    <text x="462" y="442" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#cbd5e1">Whole document · 162.2 tokens</text>
    <rect x="462" y="453" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="462" y="491" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#67e8f9">Useful chunk · 42.4 tokens</text>
    <rect x="462" y="502" width="115" height="12" rx="6" fill="url(#engraphis)"/>
    <text x="1098" y="478" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="29.7" font-weight="700" fill="#5eead4">73.9% less</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="542" width="1058" height="112" rx="16" fill="#111a2b" stroke="#27344a"/>
    <text x="94" y="572" font-family="Inter, Arial, sans-serif" font-size="18.7" font-weight="700" fill="#f8fafc">Recall payload proxy</text>
    <text x="94" y="595" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">26 payload samples · 260 timed recalls</text>
    <text x="94" y="617" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">JSON shape · not MCP transport</text>
    <text x="462" y="568" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#cbd5e1">Full proxy · 23,810 tokens</text>
    <rect x="462" y="579" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="462" y="617" font-family="Inter, Arial, sans-serif" font-size="14.3" font-weight="700" fill="#67e8f9">Compact proxy · 10,202 tokens</text>
    <rect x="462" y="628" width="189" height="12" rx="6" fill="url(#engraphis)"/>
    <text x="1098" y="604" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="29.7" font-weight="700" fill="#5eead4">57.15% less</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="668" width="1058" height="112" rx="16" fill="#111a2b" stroke="#27344a"/>
    <text x="94" y="704" font-family="Inter, Arial, sans-serif" font-size="18.7" font-weight="700" fill="#f8fafc">External and model-dependent results</text>
    <text x="94" y="733" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">Run the locked public protocol and publish a redacted immutable artifact first</text>
    <text x="94" y="759" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#fbbf24">No public score, latency, consolidation, or productivity number is currently claimed</text>
    <text x="1098" y="729" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fbbf24">Evidence pending</text>
  </g>

  <g>
    <rect x="70" y="800" width="330" height="96" rx="14" fill="#0f1c31" stroke="#254061"/>
    <text x="92" y="824" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">ARTIFACT SHA-256</text>
    <text x="92" y="850" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#f8fafc">c3a74f1770ad3f868f55261ba11680e2</text>
    <text x="92" y="873" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#f8fafc">dadca30167082ac2cb6669f9e3bdfad2</text>

    <rect x="414" y="800" width="330" height="96" rx="14" fill="#0f1c31" stroke="#254061"/>
    <text x="436" y="824" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">FIXTURE-SUITE SHA-256</text>
    <text x="436" y="850" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#f8fafc">4d7e40607319cd4bf8caee3897f1e416</text>
    <text x="436" y="873" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#f8fafc">dbe5b81998b37a7e4839409ee2923537</text>

    <rect x="758" y="800" width="370" height="96" rx="14" fill="#0f1c31" stroke="#254061"/>
    <text x="780" y="828" font-family="Inter, Arial, sans-serif" font-size="14.3" fill="#9eabc0">HARD CONTEXT CAP: 1,500</text>
    <text x="780" y="859" font-family="Inter, Arial, sans-serif" font-size="25.3" font-weight="700" fill="#f8fafc">85.38 average · 108 max</text>
    <text x="780" y="884" font-family="Inter, Arial, sans-serif" font-size="13.2" fill="#7f8da3">observed context tokens in CodeMem</text>
  </g>

  <text x="70" y="942" font-family="Inter, Arial, sans-serif" font-size="13.2" fill="#7f8da3">Separate fixture measurements; percentages are not additive. Exact commands and boundaries: BENCHMARKS.md</text>
</svg>
