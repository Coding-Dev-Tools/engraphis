<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Engraphis context efficiency in deterministic offline fixtures</title>
  <desc id="desc">Three normalized comparisons show retained token payload after using Engraphis: 27.0 percent for retrieved content, 26.1 percent for an evidence-holding record, and 44.6 percent for a compact MCP response. Every label has a separate line above its corresponding bar. Each row has a separate baseline.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1200" height="600" rx="28" fill="#f8fafc"/>
  <rect x="24" y="22" width="1152" height="556" rx="22" fill="#fff" stroke="#e2e8f0"/>
  <text x="72" y="75" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Less history in context; the same fixture-level retrieval quality</text>
  <text x="72" y="105" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Each row is normalized to its own 100% baseline. The measures count different boundaries and are not additive.</text>
  <rect x="746" y="126" width="15" height="15" rx="3" fill="#64748b"/><text x="770" y="139" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">baseline payload (100%)</text>
  <rect x="948" y="126" width="15" height="15" rx="3" fill="#2563eb"/><text x="972" y="139" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Engraphis payload retained</text>

  <g filter="url(#shadow)">
    <rect x="72" y="162" width="1056" height="110" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="96" y="194" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Retrieved memory content</text>
    <text x="96" y="217" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Long-document fixture · top-5 memory content</text>
    <text x="500" y="190" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Baseline · whole documents · 808.8 tokens</text>
    <rect x="500" y="199" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="500" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Engraphis · structure-aware chunks · 218.4 tokens · 73.0% lower</text>
    <rect x="500" y="246" width="119" height="12" rx="6" fill="#2563eb"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="288" width="1056" height="110" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="96" y="320" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Smallest evidence-holding record</text>
    <text x="96" y="343" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">Long-document fixture · evidence returned for the same 18 questions</text>
    <text x="500" y="316" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Baseline · whole documents · 162.2 tokens</text>
    <rect x="500" y="325" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="500" y="363" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Engraphis · structure-aware chunks · 42.4 tokens · 73.9% lower</text>
    <rect x="500" y="372" width="115" height="12" rx="6" fill="#2563eb"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="414" width="1056" height="110" rx="15" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="96" y="446" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Serialized MCP recall response</text>
    <text x="96" y="469" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">CodeMem fixture · retrieval scores unchanged across 260 timed recalls</text>
    <text x="500" y="442" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Baseline · full response · 17,172 tokens</text>
    <rect x="500" y="451" width="440" height="12" rx="6" fill="#64748b"/>
    <text x="500" y="489" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Engraphis · compact response · 7,663 tokens · 55.38% lower</text>
    <rect x="500" y="498" width="196" height="12" rx="6" fill="#2563eb"/>
  </g>

  <text x="72" y="558" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">Controlled deterministic offline regression fixtures, not model-billing, task-time, customer-cost, or external benchmark claims.</text>
</svg>
