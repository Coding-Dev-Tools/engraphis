<svg xmlns="http://www.w3.org/2000/svg" width="1103" height="670" viewBox="0 0 1103 670" role="img" aria-labelledby="title desc">
<title id="title">Offline context, retrieval, and grounded benchmark results</title>
<desc id="desc">Artifact-driven offline benchmark report with context efficiency, retrieval quality, and grounded behavior reported separately. Structure-aware chunking reports 740.3 to 214.3 retrieved tokens per question. The JSON-shape payload proxy reports 24,590 full versus 11,138 compact tokens; MCP transport was not measured; provider billing was not measured. Retrieved candidate quality is Recall@5 1.000, Hit@5 1.000, and answer-token recall 1.000 across 26 questions. Packed context quality is Recall@5 1.000, Hit@5 1.000, and answer-token recall 1.000 across 26 questions. Grounded checks score 5 of 5 answerable queries grounded and 6 of 6 abstention queries rejected, including 1 of 1 quarantined-evidence checks. Decision accuracy is 1.000 across 11 decisions. Source artifact SHA-256 1b894b37574eed06e56feec10840744c36b98813a36ef4c7cc38b9957856e1ef.</desc>
<style>text{font-family:Consolas,monospace;fill:#b9c8dc} .heading{font-family:Segoe UI,sans-serif;font-weight:700;fill:#f2f5f9} .green{fill:#00c896}.muted{fill:#7589a7}</style>
