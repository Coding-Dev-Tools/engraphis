<svg xmlns="http://www.w3.org/2000/svg" width="1103" height="956" viewBox="0 0 1103 956" role="img" aria-labelledby="title desc">
<title id="title">Measured context and retrieval boundaries</title>
<desc id="desc">Artifact-driven local deterministic benchmark report. Structure-aware chunks report 740.3 to 214.3 retrieved tokens per question. The performance run reports 24,590 full-proxy versus 11,138 compact-proxy tokens. Retrieved-candidate quality and packed-context quality are separate views; packed quality is shown only when the selected report includes it. Payload counts are a serialized JSON-shape proxy; the payload is not an MCP transport measurement. The report does not measure provider billing. Packed context reports 85.38 mean and 108 max under a 1,500-token cap. Source artifact SHA-256 b3934a77fe38e6356ff892940c93366304eb8e853337b87e2791c9b95791473a.</desc>
<style>text{font-family:Consolas,monospace;fill:#b9c8dc} .heading{font-family:Segoe UI,sans-serif;font-weight:700;fill:#f2f5f9} .green{fill:#00c896}.muted{fill:#7589a7}</style>
