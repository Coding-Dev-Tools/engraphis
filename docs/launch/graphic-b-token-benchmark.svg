<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-labelledby="benchTitle benchDesc">
  <title id="benchTitle">Engraphis Token Reduction &amp; Grounded Recall Benchmark</title>
  <desc id="benchDesc">Empirical offline benchmark card demonstrating 71.1% fewer retrieved tokens per question, 1.000 Recall@5 retrieval quality, and 100% grounded abstention on irrelevant queries.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#09111e" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="bCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="bEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="bPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="bShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="bDotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155" fill-opacity="0.22" />
    </pattern>
  </defs>

  <style>
    .b-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .b-mono { font-family: ui-monospace, "JetBrains Mono", Consolas, "SF Mono", monospace; }
    .b-bold { font-weight: 700; }
    .b-extrabold { font-weight: 800; letter-spacing: -0.025em; }
    .b-semibold { font-weight: 600; }
  </style>

  <!-- Background Layer -->
  <rect width="1270" height="760" fill="url(#bBgGrad)" />
  <rect width="1270" height="760" fill="url(#bDotGrid)" />
  <rect x="1" y="1" width="1268" height="758" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(40, 30)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#1e293b" stroke="#334155" />
    <circle cx="12" cy="12" r="4" fill="#10b981" />
    <text x="24" y="16" class="b-mono b-semibold" font-size="10.5" fill="#10b981" letter-spacing="0.06em">OFFLINE BENCHMARK SUITE</text>

    <!-- Title -->
    <text x="0" y="58" class="b-sans b-extrabold" font-size="28" fill="#f8fafc">71.1% Token Reduction. Zero Guesswork.</text>
    <text x="0" y="80" class="b-sans" font-size="13.5" fill="#94a3b8">Empirical coding memory efficiency: Structure-aware chunking &amp; bi-temporal retrieval vs naive full-context dumps.</text>

    <!-- Source SHA Stamp on top right -->
    <g transform="translate(900, 10)">
      <text x="330" y="16" class="b-mono" font-size="11" fill="#64748b" text-anchor="end">FIXTURE: SHA-256 3b1d2127e290...</text>
      <text x="288" y="34" class="b-mono b-semibold" font-size="11" fill="#38bdf8" text-anchor="end">26 SAMPLES • 260 RECALLS</text>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="40" y1="125" x2="1230" y2="125" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== 4 KPI CARDS ROW ==================== -->
  <g transform="translate(40, 140)">
    
    <!-- KPI 1: 71.1% Fewer Tokens -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="282" height="110" rx="10" fill="url(#bCardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#bShadow)" />
      <text x="18" y="26" class="b-mono b-bold" font-size="10" fill="#10b981" letter-spacing="0.08em">RETRIEVED CONTEXT</text>
      <text x="18" y="68" class="b-mono b-extrabold" font-size="36" fill="#10b981">-71.1%</text>
      <text x="18" y="92" class="b-sans" font-size="12" fill="#94a3b8">740.3 → <tspan fill="#f8fafc" font-weight="600">214.3 tokens / query</tspan></text>
      <circle cx="250" cy="30" r="12" fill="#064e3b" />
      <path d="M245 32 L250 25 L255 32" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 250 30)" />
    </g>

    <!-- KPI 2: 1.000 Recall@5 -->
    <g transform="translate(302, 0)">
      <rect x="0" y="0" width="282" height="110" rx="10" fill="url(#bCardGrad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#bShadow)" />
      <text x="18" y="26" class="b-mono b-bold" font-size="10" fill="#06b6d4" letter-spacing="0.08em">RETRIEVAL QUALITY</text>
      <text x="18" y="68" class="b-mono b-extrabold" font-size="36" fill="#38bdf8">1.000</text>
      <text x="18" y="92" class="b-sans" font-size="12" fill="#94a3b8"><tspan fill="#f8fafc" font-weight="600">Recall@5 1.000 · Hit@5 1.000</tspan></text>
      <circle cx="250" cy="30" r="12" fill="#164e63" />
      <path d="M244 30 L248 34 L256 26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- KPI 3: 100% Grounded Abstention -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="282" height="110" rx="10" fill="url(#bCardGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#bShadow)" />
      <text x="18" y="26" class="b-mono b-bold" font-size="10" fill="#c084fc" letter-spacing="0.08em">ANTI-HALLUCINATION</text>
      <text x="18" y="68" class="b-mono b-extrabold" font-size="36" fill="#c084fc">100%</text>
      <text x="18" y="92" class="b-sans" font-size="12" fill="#94a3b8">6/6 Irrelevant queries: <tspan fill="#f8fafc" font-weight="600">Abstained</tspan></text>
      <circle cx="250" cy="30" r="12" fill="#3b0764" />
      <circle cx="250" cy="30" r="6" fill="none" stroke="#c084fc" stroke-width="2" />
    </g>

    <!-- KPI 4: 54.7% Payload Compression -->
    <g transform="translate(908, 0)">
      <rect x="0" y="0" width="282" height="110" rx="10" fill="url(#bCardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#bShadow)" />
      <text x="18" y="26" class="b-mono b-bold" font-size="10" fill="#fbbf24" letter-spacing="0.08em">PAYLOAD EFFICIENCY</text>
      <text x="18" y="68" class="b-mono b-extrabold" font-size="36" fill="#fbbf24">-54.7%</text>
      <text x="18" y="92" class="b-sans" font-size="12" fill="#94a3b8">24.5k → <tspan fill="#f8fafc" font-weight="600">11.1k tokens (compact)</tspan></text>
      <circle cx="250" cy="30" r="12" fill="#451a03" />
      <path d="M245 32 L250 25 L255 32" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 250 30)" />
    </g>

  </g>

  <!-- ==================== MAIN COMPARISON SECTION ==================== -->
  <g transform="translate(40, 275)">
    
    <!-- LEFT CARD: THE BENCHMARK BAR VISUALIZATION -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="585" height="430" rx="10" fill="url(#bCardGrad)" stroke="#334155" filter="url(#bShadow)" />
      
      <!-- Card Title -->
      <text x="24" y="34" class="b-sans b-bold" font-size="17" fill="#f8fafc">Context Injection Comparison</text>
      <text x="24" y="54" class="b-sans" font-size="12" fill="#94a3b8">Retrieved token volume injected into agent prompt per inquiry</text>

      <!-- BAR 1: NAIVE FULL-DOC DUMP -->
      <g transform="translate(24, 80)">
        <text x="0" y="16" class="b-mono b-semibold" font-size="12" fill="#f87171">Brute-Force Context Dump (Cursor/Claude Raw)</text>
        <text x="535" y="16" class="b-mono b-bold" font-size="13" fill="#f87171" text-anchor="end">740.3 tokens</text>
        
        <!-- Track & Bar -->
        <rect x="0" y="26" width="535" height="26" rx="6" fill="#1a1c24" stroke="#334155" />
        <rect x="0" y="26" width="535" height="26" rx="6" fill="#dc2626" opacity="0.85" />
        <text x="12" y="44" class="b-sans b-semibold" font-size="11" fill="#ffffff">Entire document injected (noise + boilerplate + stale history)</text>
      </g>

      <!-- BAR 2: ENGRAPHIS STRUCTURE-AWARE CHUNKING -->
      <g transform="translate(24, 160)">
        <text x="0" y="16" class="b-mono b-semibold" font-size="12" fill="#34d399">Engraphis Grounded Hybrid Recall (v2 Core)</text>
        <text x="535" y="16" class="b-mono b-bold" font-size="13" fill="#34d399" text-anchor="end">214.3 tokens (-71.1%)</text>
        
        <!-- Track & Bar -->
        <rect x="0" y="26" width="535" height="26" rx="6" fill="#1a1c24" stroke="#334155" />
        <rect x="0" y="26" width="154" height="26" rx="6" fill="url(#bEmerald)" />
        <text x="165" y="44" class="b-mono b-bold" font-size="11" fill="#34d399">← Precise fact slices only</text>
      </g>

      <!-- COST & PERFORMANCE TABLE -->
      <g transform="translate(24, 240)">
        <rect x="0" y="0" width="535" height="165" rx="8" fill="#0d1424" stroke="#1e293b" />
        
        <!-- Table Header -->
        <text x="20" y="26" class="b-mono b-bold" font-size="11" fill="#64748b">METRIC</text>
        <text x="230" y="26" class="b-mono b-bold" font-size="11" fill="#f87171">BRUTE-FORCE DUMP</text>
        <text x="400" y="26" class="b-mono b-bold" font-size="11" fill="#34d399">ENGRAPHIS v2</text>
        <line x1="20" y1="36" x2="515" y2="36" stroke="#1e293b" stroke-width="1.2" />

        <!-- Row 1: Token Cost -->
        <text x="20" y="60" class="b-sans b-semibold" font-size="12" fill="#e2e8f0">Retrieved Context Tokens</text>
        <text x="230" y="60" class="b-mono" font-size="12" fill="#fca5a5">740.3 / question</text>
        <text x="400" y="60" class="b-mono b-bold" font-size="12" fill="#34d399">214.3 / question</text>

        <!-- Row 2: Latency -->
        <text x="20" y="92" class="b-sans b-semibold" font-size="12" fill="#e2e8f0">Context Lookup Speed</text>
        <text x="230" y="92" class="b-mono" font-size="12" fill="#cbd5e1">local in-process</text>
        <text x="400" y="92" class="b-mono b-bold" font-size="12" fill="#34d399">local in-process</text>

        <!-- Row 3: Hallucination Risk -->
        <text x="20" y="124" class="b-sans b-semibold" font-size="12" fill="#e2e8f0">Stale/Contradictory Facts</text>
        <text x="230" y="124" class="b-mono" font-size="12" fill="#fca5a5">High (Silent drift)</text>
        <text x="400" y="124" class="b-mono b-bold" font-size="12" fill="#34d399">Zero (Bi-temporal lock)</text>

        <!-- Row 4: Auditability -->
        <text x="20" y="152" class="b-sans b-semibold" font-size="12" fill="#e2e8f0">Evidence Citations</text>
        <text x="230" y="152" class="b-mono" font-size="12" fill="#cbd5e1">None (Opaque guess)</text>
        <text x="400" y="152" class="b-mono b-bold" font-size="12" fill="#34d399">Deterministic [n] IDs</text>
      </g>
    </g>

    <!-- RIGHT CARD: THE GROUNDED ABSTENTION ENGINE -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="585" height="430" rx="10" fill="url(#bCardGrad)" stroke="#334155" filter="url(#bShadow)" />

      <!-- Card Title -->
      <text x="24" y="34" class="b-sans b-bold" font-size="17" fill="#f8fafc">Dual-Path Grounded Precision Engine</text>
      <text x="24" y="54" class="b-sans" font-size="12" fill="#94a3b8">Answers strictly from verified facts. Abstains when evidence is missing.</text>

      <!-- TEST CASE 1: GROUNDED ANSWER -->
      <g transform="translate(24, 76)">
        <rect x="0" y="0" width="537" height="150" rx="8" fill="#0b171c" stroke="#10b981" stroke-width="1.2" />
        
        <!-- Header -->
        <rect x="14" y="12" width="160" height="20" rx="4" fill="#064e3b" />
        <text x="22" y="26" class="b-mono b-bold" font-size="10" fill="#34d399">CASE 1 • ANSWERABLE (5/5)</text>
        
        <text x="400" y="26" class="b-mono text-bold" font-size="11" fill="#34d399" text-anchor="end">Support Score: 0.942 ≥ 0.25</text>

        <!-- Query -->
        <text x="14" y="52" class="b-mono" font-size="11.5" fill="#94a3b8">Q: <tspan fill="#f1f5f9">"Why is WAL checkpoint PASSIVE mode required in v2?"</tspan></text>

        <!-- Grounded Output -->
        <rect x="14" y="64" width="509" height="42" rx="4" fill="#132a24" stroke="#059669" />
        <text x="24" y="82" class="b-mono b-semibold" font-size="11" fill="#34d399">✓ GROUNDED CITATION [1]:</text>
        <text x="24" y="96" class="b-sans" font-size="11.5" fill="#e2e8f0">PASSIVE prevents reader starvation during high-frequency parallel agent writes.</text>

        <!-- Provenance Footer -->
        <text x="14" y="128" class="b-mono" font-size="10" fill="#6ee7b7">• Provenance: <tspan fill="#e2e8f0">mem_01hq7w8... (valid_from: 2026-03-12, commit a7f9d)</tspan></text>
        <text x="14" y="140" class="b-mono" font-size="10" fill="#6ee7b7">• Retained Tokens: <tspan fill="#34d399">packed context (registered artifact)</tspan></text>
      </g>

      <!-- TEST CASE 2: DETERMINISTIC ABSTENTION -->
      <g transform="translate(24, 246)">
        <rect x="0" y="0" width="537" height="150" rx="8" fill="#181119" stroke="#f43f5e" stroke-width="1.2" />

        <!-- Header -->
        <rect x="14" y="12" width="180" height="20" rx="4" fill="#4c0519" />
        <text x="22" y="26" class="b-mono b-bold" font-size="10" fill="#fb7185">CASE 2 • OFF-TOPIC BAIT (6/6)</text>

        <text x="430" y="26" class="b-mono text-bold" font-size="11" fill="#fb7185" text-anchor="end">Support Score: 0.114 &lt; 0.25</text>

        <!-- Query -->
        <text x="14" y="52" class="b-mono" font-size="11.5" fill="#94a3b8">Q: <tspan fill="#f1f5f9">"What is our production Kubernetes cluster egress CIDR in AWS?"</tspan></text>

        <!-- Abstain Output -->
        <rect x="14" y="64" width="509" height="42" rx="4" fill="#2c1018" stroke="#be123c" />
        <text x="24" y="82" class="b-mono b-bold" font-size="11" fill="#fb7185">× ABSTAIN • STRICT SUPPORT FLOOR TRIGGERED</text>
        <text x="24" y="96" class="b-sans" font-size="11.5" fill="#fda4af">Engine refused extrapolation; probe recorded as abstained.</text>

        <!-- Provenance Footer -->
        <text x="14" y="128" class="b-mono" font-size="10" fill="#fda4af">• Defense: <tspan fill="#e2e8f0">Quarantine &amp; Floor Check prevented context contamination</tspan></text>
        <text x="14" y="140" class="b-mono" font-size="10" fill="#fda4af">• Accuracy: <tspan fill="#fb7185">11 of 11 verified decisions correct (1.000 accuracy)</tspan></text>
      </g>

    </g>

  </g>

  <!-- Canvas Footer -->
  <text x="42" y="736" class="b-mono" font-size="10.5" fill="#475569">Tested on Python 3.9-3.14 • Full eval code: python -m eval.harness &amp; python -m eval.grounded</text>
  <text x="1228" y="736" class="b-mono" font-size="10.5" fill="#475569" text-anchor="end">Engraphis Local-First AI Memory • Apache-2.0</text>
</svg>
