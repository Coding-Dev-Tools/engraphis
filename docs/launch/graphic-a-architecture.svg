<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Engraphis Architecture &amp; 4-Arm Hybrid Recall Infographic</title>
  <desc id="desc">High-performance local-first AI memory engine architecture with scoped hierarchy, bi-temporal SQLite persistence, 4-arm hybrid recall (vector, lexical, graph, code), and grounded citation delivery with 71.1% token reduction.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#131c2e" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="33%" stop-color="#06b6d4" />
      <stop offset="66%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, "JetBrains Mono", Consolas, "SF Mono", monospace; }
    .text-title { font-weight: 800; letter-spacing: -0.025em; }
    .text-semibold { font-weight: 600; }
    .text-bold { font-weight: 700; }
  </style>

  <!-- Background Layer -->
  <rect width="1270" height="760" fill="url(#bgGrad)" />
  <rect width="1270" height="760" fill="url(#dotGrid)" />

  <!-- Outer Canvas Border -->
  <rect x="1" y="1" width="1268" height="758" rx="0" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(40, 32)">
    <!-- Engraphis Logo Icon -->
    <rect x="0" y="2" width="38" height="38" rx="8" fill="url(#emeraldGrad)" />
    <path d="M9 21 L16 28 L29 14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Title & Brand -->
    <text x="52" y="24" class="font-sans text-title" font-size="24" fill="#f8fafc">engraphis</text>
    <text x="180" y="24" class="font-mono text-semibold" font-size="12" fill="#10b981" letter-spacing="0.1em">LOCAL-FIRST AI AGENT MEMORY</text>
    <text x="52" y="42" class="font-sans" font-size="13" fill="#94a3b8">Bi-Temporal SQLite Engine &bull; 4-Arm Hybrid Recall &bull; 71.1% Token Reduction</text>

    <!-- Header Badges -->
    <g transform="translate(730, 4)">
      <!-- Badge 1: SQLite -->
      <rect x="0" y="0" width="120" height="30" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="14" cy="15" r="4" fill="#10b981" />
      <text x="26" y="19" class="font-mono text-semibold" font-size="11" fill="#cbd5e1">100% Local SQLite</text>

      <!-- Badge 2: MCP Native -->
      <rect x="130" y="0" width="105" height="30" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="144" cy="15" r="4" fill="#06b6d4" />
      <text x="156" y="19" class="font-mono text-semibold" font-size="11" fill="#cbd5e1">MCP Native</text>

      <!-- Badge 3: Zero Telemetry -->
      <rect x="245" y="0" width="115" height="30" rx="6" fill="#1e293b" stroke="#334155" />
      <circle cx="259" cy="15" r="4" fill="#8b5cf6" />
      <text x="271" y="19" class="font-mono text-semibold" font-size="11" fill="#cbd5e1">Zero Telemetry</text>

      <!-- Badge 4: Grounded -->
      <rect x="370" y="0" width="90" height="30" rx="6" fill="#132e27" stroke="#10b981" stroke-width="1.2" />
      <text x="382" y="19" class="font-mono text-bold" font-size="11" fill="#10b981">v2 Core v19</text>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="40" y1="94" x2="1230" y2="94" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== TOP STACK: SCOPED HIERARCHY ==================== -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="1190" height="74" rx="10" fill="url(#cardGrad)" stroke="#334155" filter="url(#cardShadow)" />
    
    <text x="24" y="28" class="font-mono text-bold" font-size="11" fill="#10b981" letter-spacing="0.08em">SCOPED HIERARCHICAL REPOSITORY ISOLATION</text>
    <text x="24" y="52" class="font-sans" font-size="12" fill="#94a3b8">Every fact, observation, and decision carries strict provenance across 4 nested scopes:</text>

    <!-- Scope Pills -->
    <!-- Scope 1: Workspace -->
    <g transform="translate(460, 18)">
      <rect x="0" y="0" width="165" height="38" rx="6" fill="#182235" stroke="#3b82f6" stroke-width="1.2" />
      <text x="14" y="17" class="font-mono text-bold" font-size="11" fill="#60a5fa">WORKSPACE</text>
      <text x="14" y="31" class="font-mono" font-size="10" fill="#93c5fd">ws_01j7... (AcmeCorp)</text>
    </g>
    <!-- Arrow -->
    <path d="M635 37 L647 37" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <polygon points="651,37 645,33 645,41" fill="#475569" />

    <!-- Scope 2: Repo -->
    <g transform="translate(660, 18)">
      <rect x="0" y="0" width="160" height="38" rx="6" fill="#182235" stroke="#06b6d4" stroke-width="1.2" />
      <text x="14" y="17" class="font-mono text-bold" font-size="11" fill="#22d3ee">REPO</text>
      <text x="14" y="31" class="font-mono" font-size="10" fill="#a5f3fc">repo_backend_api</text>
    </g>
    <!-- Arrow -->
    <path d="M830 37 L842 37" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <polygon points="846,37 840,33 840,41" fill="#475569" />

    <!-- Scope 3: Session -->
    <g transform="translate(855, 18)">
      <rect x="0" y="0" width="150" height="38" rx="6" fill="#182235" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="17" class="font-mono text-bold" font-size="11" fill="#a78bfa">SESSION</text>
      <text x="14" y="31" class="font-mono" font-size="10" fill="#c4b5fd">ses_claude_refactor</text>
    </g>
    <!-- Arrow -->
    <path d="M1015 37 L1027 37" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <polygon points="1031,37 1025,33 1025,41" fill="#475569" />

    <!-- Scope 4: Memory -->
    <g transform="translate(1040, 18)">
      <rect x="0" y="0" width="130" height="38" rx="6" fill="#132e27" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="17" class="font-mono text-bold" font-size="11" fill="#34d399">MEMORY [n]</text>
      <text x="12" y="31" class="font-mono" font-size="10" fill="#6ee7b7">mem_bi_temporal</text>
    </g>
  </g>

  <!-- ==================== MIDDLE SECTION: 4-ARM HYBRID RECALL ==================== -->
  
  <!-- Section Title & Query Input Node -->
  <g transform="translate(40, 204)">
    <text x="0" y="16" class="font-mono text-bold" font-size="11" fill="#64748b" letter-spacing="0.1em">STAGE 1: 4-ARM PARALLEL RETRIEVAL PIPELINE</text>
    
    <!-- Agent Query Bar -->
    <rect x="0" y="28" width="1190" height="42" rx="8" fill="#131b2a" stroke="#334155" />
    <text x="18" y="54" class="font-mono text-bold" font-size="12" fill="#10b981">QUERY INPUT &rarr;</text>
    <text x="125" y="54" class="font-mono" font-size="12" fill="#e2e8f0">"Why do we use PASSIVE mode in SQLite WAL checkpoints during concurrent agent writes?"</text>
    
    <rect x="940" y="34" width="235" height="30" rx="5" fill="#1e293b" stroke="#475569" />
    <text x="952" y="53" class="font-mono text-semibold" font-size="11" fill="#38bdf8">SearchFilter(as_of=now, scope=repo)</text>
  </g>

  <!-- Branching Connectors from Query to 4 Arms -->
  <path d="M 180 274 L 180 300" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <path d="M 480 274 L 480 300" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
  <path d="M 780 274 L 780 300" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <path d="M 1080 274 L 1080 300" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />

  <!-- THE 4 ARMS (4 CARDS) -->
  <g transform="translate(40, 300)">
    
    <!-- ARM 1: VECTOR (Semantic Cosine) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="282" height="195" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Top Pill -->
      <rect x="16" y="14" width="90" height="22" rx="4" fill="#064e3b" />
      <text x="24" y="29" class="font-mono text-bold" font-size="10" fill="#34d399">ARM 1 &bull; VECTOR</text>

      <text x="16" y="58" class="font-sans text-bold" font-size="16" fill="#f8fafc">Semantic Cosine</text>
      <text x="16" y="78" class="font-sans" font-size="12" fill="#94a3b8">Dense embedding distance via offline hashing or local SentenceTransformers.</text>

      <!-- Details Box -->
      <rect x="14" y="96" width="254" height="82" rx="6" fill="#0c1422" stroke="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10.5" fill="#64748b">&bull; Engine: <tspan fill="#e2e8f0">sqlite-vec / NumPy</tspan></text>
      <text x="24" y="134" class="font-mono" font-size="10.5" fill="#64748b">&bull; Model: <tspan fill="#e2e8f0">all-MiniLM-L6-v2</tspan></text>
      <text x="24" y="152" class="font-mono" font-size="10.5" fill="#64748b">&bull; Metric: <tspan fill="#34d399">L2 Normalized Cosine</tspan></text>
      <text x="24" y="170" class="font-mono" font-size="10.5" fill="#64748b">&bull; Latency: <tspan fill="#34d399">&lt; 12ms</tspan></text>
    </g>

    <!-- ARM 2: LEXICAL (FTS5 / BM25) -->
    <g transform="translate(302, 0)">
      <rect x="0" y="0" width="282" height="195" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Top Pill -->
      <rect x="16" y="14" width="95" height="22" rx="4" fill="#164e63" />
      <text x="24" y="29" class="font-mono text-bold" font-size="10" fill="#38bdf8">ARM 2 &bull; LEXICAL</text>

      <text x="16" y="58" class="font-sans text-bold" font-size="16" fill="#f8fafc">Exact BM25 / FTS5</text>
      <text x="16" y="78" class="font-sans" font-size="12" fill="#94a3b8">Native SQLite full-text search with automatic LIKE fallback on slim builds.</text>

      <!-- Details Box -->
      <rect x="14" y="96" width="254" height="82" rx="6" fill="#0c1422" stroke="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10.5" fill="#64748b">&bull; Tokenizer: <tspan fill="#e2e8f0">Porter Stem / Unicode</tspan></text>
      <text x="24" y="134" class="font-mono" font-size="10.5" fill="#64748b">&bull; Match: <tspan fill="#e2e8f0">BM25 Rank Formula</tspan></text>
      <text x="24" y="152" class="font-mono" font-size="10.5" fill="#64748b">&bull; Target: <tspan fill="#38bdf8">Identifiers &amp; Error Logs</tspan></text>
      <text x="24" y="170" class="font-mono" font-size="10.5" fill="#64748b">&bull; Fallback: <tspan fill="#38bdf8">Deterministic LIKE</tspan></text>
    </g>

    <!-- ARM 3: GRAPH (Personalized PageRank) -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="282" height="195" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Top Pill -->
      <rect x="16" y="14" width="85" height="22" rx="4" fill="#3b0764" />
      <text x="24" y="29" class="font-mono text-bold" font-size="10" fill="#c084fc">ARM 3 &bull; GRAPH</text>

      <text x="16" y="58" class="font-sans text-bold" font-size="16" fill="#f8fafc">Bi-Temporal PageRank</text>
      <text x="16" y="78" class="font-sans" font-size="12" fill="#94a3b8">Personalized PageRank over entity-link topology with validity window gating.</text>

      <!-- Details Box -->
      <rect x="14" y="96" width="254" height="82" rx="6" fill="#0c1422" stroke="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10.5" fill="#64748b">&bull; Algorithm: <tspan fill="#e2e8f0">Personalized PageRank</tspan></text>
      <text x="24" y="134" class="font-mono" font-size="10.5" fill="#64748b">&bull; Nodes: <tspan fill="#e2e8f0">Entities + Decisions</tspan></text>
      <text x="24" y="152" class="font-mono" font-size="10.5" fill="#64748b">&bull; Temporal: <tspan fill="#c084fc">valid_from &rarr; valid_to</tspan></text>
      <text x="24" y="170" class="font-mono" font-size="10.5" fill="#64748b">&bull; Damping: <tspan fill="#c084fc">&alpha; = 0.85 (1-hop / multi)</tspan></text>
    </g>

    <!-- ARM 4: CODE (AST & Call Graph) -->
    <g transform="translate(908, 0)">
      <rect x="0" y="0" width="282" height="195" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Top Pill -->
      <rect x="16" y="14" width="80" height="22" rx="4" fill="#451a03" />
      <text x="24" y="29" class="font-mono text-bold" font-size="10" fill="#fbbf24">ARM 4 &bull; CODE</text>

      <text x="16" y="58" class="font-sans text-bold" font-size="16" fill="#f8fafc">AST Symbol Graph</text>
      <text x="16" y="78" class="font-sans" font-size="12" fill="#94a3b8">Deterministic symbol tables, call graphs, and file bridges bound to memories.</text>

      <!-- Details Box -->
      <rect x="14" y="96" width="254" height="82" rx="6" fill="#0c1422" stroke="#1e293b" />
      <text x="24" y="116" class="font-mono" font-size="10.5" fill="#64748b">&bull; Index: <tspan fill="#e2e8f0">AST Symbol Table</tspan></text>
      <text x="24" y="134" class="font-mono" font-size="10.5" fill="#64748b">&bull; Edges: <tspan fill="#e2e8f0">Callers, Callees, Files</tspan></text>
      <text x="24" y="152" class="font-mono" font-size="10.5" fill="#64748b">&bull; Memory Bridge: <tspan fill="#fbbf24">Code &harr; Rationale</tspan></text>
      <text x="24" y="170" class="font-mono" font-size="10.5" fill="#64748b">&bull; Resolution: <tspan fill="#fbbf24">Line &amp; Commit Bound</tspan></text>
    </g>

  </g>

  <!-- Connectors from 4 Arms converging into Fusion Engine -->
  <path d="M 180 495 L 180 520 L 590 520 L 590 535" stroke="#10b981" stroke-width="2" fill="none" />
  <path d="M 480 495 L 480 515 L 610 515 L 610 535" stroke="#06b6d4" stroke-width="2" fill="none" />
  <path d="M 780 495 L 780 515 L 660 515 L 660 535" stroke="#8b5cf6" stroke-width="2" fill="none" />
  <path d="M 1080 495 L 1080 520 L 680 520 L 680 535" stroke="#f59e0b" stroke-width="2" fill="none" />

  <!-- ==================== BOTTOM STACK: FUSION & GROUNDED DELIVERY ==================== -->
  <g transform="translate(40, 535)">
    <rect x="0" y="0" width="1190" height="185" rx="10" fill="url(#cardGrad)" stroke="#334155" filter="url(#cardShadow)" />
    
    <!-- Left Subcard: Fusion & 6-Term Scoring Formula -->
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="560" height="152" rx="8" fill="#0c1322" stroke="#1e293b" />
      
      <rect x="14" y="12" width="165" height="20" rx="4" fill="#1e293b" />
      <text x="22" y="26" class="font-mono text-bold" font-size="10" fill="#38bdf8">STAGE 2: FUSION &amp; DECAY</text>

      <text x="14" y="52" class="font-sans text-bold" font-size="14" fill="#f8fafc">Reciprocal Rank Fusion (RRF k=60) + 6-Term Scoring</text>
      
      <!-- Scoring Formula in Code Box -->
      <rect x="14" y="64" width="532" height="34" rx="4" fill="#131c2d" stroke="#334155" />
      <text x="24" y="86" class="font-mono text-semibold" font-size="11.5" fill="#34d399">score = w_r&middot;R(t) + w_s&middot;sem + w_l&middot;lex + w_g&middot;graph + w_i&middot;imp &minus; w_x&middot;stale</text>

      <!-- Sub-bullets -->
      <text x="14" y="120" class="font-sans" font-size="11.5" fill="#94a3b8">&bull; <tspan fill="#e2e8f0" font-weight="600">Ebbinghaus Retention:</tspan> R(t) = exp(-&Delta;t / S) &bull; Spaced Reinforcement Boosts</text>
      <text x="14" y="138" class="font-sans" font-size="11.5" fill="#94a3b8">&bull; <tspan fill="#e2e8f0" font-weight="600">Bi-Temporal Filter:</tspan> Query as_of window hides superseded invalid facts</text>
    </g>

    <!-- Right Subcard: Grounded Output & Abstain Gate -->
    <g transform="translate(605, 16)">
      <rect x="0" y="0" width="565" height="152" rx="8" fill="#0c1322" stroke="#10b981" stroke-width="1.2" />

      <rect x="14" y="12" width="195" height="20" rx="4" fill="#064e3b" />
      <text x="22" y="26" class="font-mono text-bold" font-size="10" fill="#34d399">STAGE 3: GROUNDED CITATIONS</text>

      <text x="14" y="52" class="font-sans text-bold" font-size="14" fill="#f8fafc">Deterministic Citations [n] or Strict Abstain</text>

      <!-- Terminal Output Mockup -->
      <rect x="14" y="64" width="537" height="42" rx="4" fill="#071a17" stroke="#059669" />
      <text x="24" y="82" class="font-mono" font-size="11" fill="#34d399">&check; GROUNDED [1]: <tspan fill="#e2e8f0">WAL PASSIVE mode prevents writer thread starvation.</tspan></text>
      <text x="24" y="97" class="font-mono" font-size="10" fill="#6ee7b7">  Provenance: mem_01hq7w8... &bull; valid_from: 2026-03-12 &bull; Support: 0.942</text>

      <!-- Bottom Benefit Bar -->
      <g transform="translate(14, 116)">
        <rect x="0" y="0" width="260" height="24" rx="4" fill="#132e27" />
        <text x="10" y="16" class="font-mono text-bold" font-size="10.5" fill="#10b981">71.1% FEWER RETRIEVED TOKENS</text>

        <rect x="272" y="0" width="265" height="24" rx="4" fill="#1e293b" />
        <text x="282" y="16" class="font-mono text-bold" font-size="10.5" fill="#f43f5e">ZERO HALLUCINATION &bull; ABSTAIN GATE</text>
      </g>
    </g>

  </g>

  <!-- Canvas Footer -->
  <text x="42" y="742" class="font-mono" font-size="10.5" fill="#475569">Engraphis Open Core Engine &bull; Apache-2.0 / MIT &bull; pip install engraphis &bull; github.com/Coding-Dev-Tools/engraphis</text>
  <text x="1228" y="742" class="font-mono" font-size="10.5" fill="#475569" text-anchor="end">Product Hunt Launch Edition &bull; 1270&times;760</text>
</svg>
