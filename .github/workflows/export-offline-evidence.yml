name: Temporary offline evidence export
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-offline-evidence.yml"
      - "engraphis/**"
      - "eval/**"
      - "scripts/export_offline_evidence.py"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install numpy cairosvg
      - run: python -m scripts.export_offline_evidence --output docs/benchmark-evidence/offline-fixtures-v152.json
      - run: python scripts/render_benchmark_report.py --report docs/benchmark-evidence/offline-fixtures-v152.json --output /tmp/context-efficiency.svg --png-output /tmp/context-efficiency.png
      - run: python -m scripts.render_benchmark_examples --report docs/benchmark-evidence/offline-fixtures-v152.json --output /tmp/evidence-backed-agent-examples.svg --png-output /tmp/evidence-backed-agent-examples.png
      - name: Show generated public artifacts
        run: |
          echo "BEGIN_OFFLINE_FIXTURES_JSON"
          cat docs/benchmark-evidence/offline-fixtures-v152.json
          echo "END_OFFLINE_FIXTURES_JSON"
          echo "BEGIN_OFFLINE_FIXTURES_SHA"
          cat docs/benchmark-evidence/offline-fixtures-v152.json.sha256
          echo "END_OFFLINE_FIXTURES_SHA"
          echo "BEGIN_CONTEXT_EFFICIENCY_SVG"
          cat /tmp/context-efficiency.svg
          echo "END_CONTEXT_EFFICIENCY_SVG"
          echo "BEGIN_EVIDENCE_BACKED_EXAMPLES_SVG"
          cat /tmp/evidence-backed-agent-examples.svg
          echo "END_EVIDENCE_BACKED_EXAMPLES_SVG"
          echo "BEGIN_CONTEXT_EFFICIENCY_PNG_BASE64"
          base64 -w 76 /tmp/context-efficiency.png
          echo "END_CONTEXT_EFFICIENCY_PNG_BASE64"
          echo "BEGIN_EVIDENCE_BACKED_EXAMPLES_PNG_BASE64"
          base64 -w 76 /tmp/evidence-backed-agent-examples.png
          echo "END_EVIDENCE_BACKED_EXAMPLES_PNG_BASE64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offline-fixtures-v152
          path: |
            docs/benchmark-evidence/offline-fixtures-v152.json
            docs/benchmark-evidence/offline-fixtures-v152.json.sha256
            /tmp/context-efficiency.svg
            /tmp/evidence-backed-agent-examples.svg
            /tmp/context-efficiency.png
            /tmp/evidence-backed-agent-examples.png
          retention-days: 1
